[package]
name = "topo-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
topo-core = { workspace = true, features = ["fs"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# `platform-verifier`: trust the certificates the system trusts, which a proxy
# that terminates TLS (as in cloud agent sandboxes) relies on.
ureq = { version = "3", features = ["json", "platform-verifier"] }
toml = "1.1"
fastrand = "2"

[dev-dependencies]
mockito = "1"
tempfile = "3"
