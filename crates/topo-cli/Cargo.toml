[package]
name = "topo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "topo"
path = "src/main.rs"

[dependencies]
topo-core = { workspace = true, features = ["fs"] }
topo-jev.workspace = true
topo-cloud.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
notify.workspace = true
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"
# The cloud tests serve the real API in this process.
topo-server = { path = "../topo-server", features = ["native"] }
axum = { version = "0.8", features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt", "net"] }
