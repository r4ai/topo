[package]
name = "topo-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "topo-gui"
path = "src/main.rs"

[features]
# `--screenshot` renders the window offscreen to a PNG. It needs gpui's
# test-support renderer and is therefore off by default.
screenshot = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
topo-core = { workspace = true, features = ["fs"] }
topo-jev.workspace = true
topo-cloud.workspace = true
anyhow.workspace = true
notify.workspace = true
jiff.workspace = true
serde.workspace = true
toml.workspace = true
unicode-segmentation = "1"
futures = "0.3"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
# gpui is not regularly published to crates.io; track Zed's repo at a pinned
# commit, which carries the offscreen renderer the `screenshot` feature uses.
gpui = { git = "https://github.com/zed-industries/zed", rev = "b77ec90b2e6585622099235d9fb7d708d22ad956" }
# The platform shim `Application::with_platform` needs. `runtime_shaders`
# compiles Metal shaders at startup, so the Xcode `metal` tool is not required.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b77ec90b2e6585622099235d9fb7d708d22ad956", features = ["font-kit", "runtime_shaders"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Trackpad pinch and smart zoom, which gpui does not report.
objc = "0.2"
block = "0.1"

[target.'cfg(target_os = "windows")'.build-dependencies]
# Already used by GPUI; resource ID 1 is its native window icon.
embed-resource = "3.0"

[lints.rust]
# objc 0.2 macros test a `cargo-clippy` feature in the calling crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
# Headless windows that take simulated input, for the interaction tests.
gpui = { git = "https://github.com/zed-industries/zed", rev = "b77ec90b2e6585622099235d9fb7d708d22ad956", features = ["test-support"] }
tempfile = "3"
serde_json.workspace = true
