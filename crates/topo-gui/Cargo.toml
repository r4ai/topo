[package]
name = "topo-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "topo-gui"
path = "src/main.rs"

[dependencies]
topo-core.workspace = true
topo-jev.workspace = true
anyhow.workspace = true
notify.workspace = true
# `runtime_shaders` compiles Metal shaders at startup, so the Xcode `metal` tool is not required.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
