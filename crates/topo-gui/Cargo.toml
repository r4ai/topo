[package]
name = "topo-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "topo-gui"
path = "src/main.rs"

[dependencies]
topo-core.workspace = true
topo-jev.workspace = true
anyhow.workspace = true
notify.workspace = true
jiff.workspace = true
unicode-segmentation = "1"
futures = "0.3"
# `runtime_shaders` compiles Metal shaders at startup, so the Xcode `metal` tool is not required.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Trackpad pinch and smart zoom, which gpui does not report.
objc = "0.2"
block = "0.1"

[target.'cfg(target_os = "windows")'.build-dependencies]
# Already used by GPUI; resource ID 1 is its native window icon.
embed-resource = "3.0"

[lints.rust]
# objc 0.2 macros test a `cargo-clippy` feature in the calling crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
# Headless windows that take simulated input, for the interaction tests.
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }
tempfile = "3"
