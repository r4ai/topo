[package]
name = "topo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["fs"]
# The `.topo` directory store. The server builds without it.
fs = ["dep:serde_yaml_ng", "dep:cap-std", "dep:cap-fs-ext", "dep:cap-tempfile"]
# OpenAPI schemas for the types that cross the HTTP API.
openapi = ["dep:utoipa"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
serde_yaml_ng = { version = "0.10", optional = true }
cap-std = { version = "4.0.3", optional = true }
cap-fs-ext = { version = "4.0.3", optional = true }
cap-tempfile = { version = "4.0.3", optional = true }
# Without `js` the generator has a fixed seed on WebAssembly.
fastrand = { version = "2", features = ["js"] }
getrandom = "0.4"
utoipa = { version = "6", features = ["jiff_0_2"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tempfile = "3"
