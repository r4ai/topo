<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>topo — promo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 10px 16px;
        font: 13px ui-monospace, monospace; color: #9b9dab; background: rgba(0, 0, 0, 0.6); }
      #bar input { flex: 1; }
      #bar button { font: inherit; color: #e8e9ee; background: #2a2c36; border: 1px solid #3b3e4a; border-radius: 6px; padding: 4px 12px; }
      body.render #bar { display: none; }
      body.render canvas { width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="bar">
      <button id="play">play</button>
      <input id="seek" type="range" min="0" max="58" step="0.01" value="0" />
      <span id="time">0.00</span>
    </div>
    <script src="src/shared.js"></script>
    <script src="src/engine.js"></script>
    <script src="src/scenes_intro.js"></script>
    <script src="src/scenes_product.js"></script>
    <script src="src/scenes_outro.js"></script>
    <script src="src/main.js"></script>
    <script>
      const q = new URLSearchParams(location.search);
      const canvas = document.getElementById("c");
      if (q.has("render")) {
        // Offline: the renderer calls PVcapture(t) for every frame.
        document.body.classList.add("render");
        window.PVcapture = async (t, samples, type, quality) => {
          await PV.render(t, { samples });
          return canvas.toDataURL(type, quality);
        };
        PV.init(canvas).then(() => (window.PVready = true));
      } else {
        const audio = new Audio("out/audio.wav");
        const seek = document.getElementById("seek");
        const label = document.getElementById("time");
        let busy = false;
        const show = async (t) => {
          if (busy) return;
          busy = true;
          await PV.render(t);
          label.textContent = t.toFixed(2);
          busy = false;
        };
        const loop = () => {
          if (!audio.paused) {
            seek.value = audio.currentTime;
            show(audio.currentTime);
          }
          requestAnimationFrame(loop);
        };
        document.getElementById("play").onclick = () => (audio.paused ? audio.play() : audio.pause());
        seek.oninput = () => {
          audio.currentTime = +seek.value;
          show(+seek.value);
        };
        PV.init(canvas, { preview: true }).then(() => {
          const t = +(q.get("t") || 0);
          seek.value = t;
          audio.currentTime = t;
          show(t);
          loop();
        });
      }
    </script>
  </body>
</html>
