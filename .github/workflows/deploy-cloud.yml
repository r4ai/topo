name: Deploy cloud API

# Deploys crates/topo-server to Cloudflare Workers. See docs/cloud/deployment.md
# for the resources and secrets this expects.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: production
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-cloud-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'production' }}
    defaults:
      run:
        shell: bash
        working-directory: crates/topo-server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENVIRONMENT: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.96.0'
          targets: wasm32-unknown-unknown
      # The migration runs first, so every migration must leave the deployed Worker working.
      - name: Apply database migrations
        run: |
          case "$ENVIRONMENT" in
            production) npx --yes wrangler@4 d1 migrations apply topo --remote ;;
            staging) npx --yes wrangler@4 d1 migrations apply topo-staging --remote --env staging ;;
          esac
      - name: Deploy the Worker
        run: |
          case "$ENVIRONMENT" in
            production) npx --yes wrangler@4 deploy ;;
            staging) npx --yes wrangler@4 deploy --env staging ;;
          esac
