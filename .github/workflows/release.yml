name: Release

on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          RELEASE_TAG="${RELEASE_TAG#release/}" python3 .github/scripts/validate-release.py

  # A manual retry must run from the tag itself, so CI always checks the release commit.
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  macos-icon:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Compile the layered macOS icon with Apple tools
        run: |
          mkdir macos-icon
          xcrun actool assets/branding/topo.icon --compile macos-icon \
            --platform macosx --minimum-deployment-target 13.0 --app-icon topo \
            --output-partial-info-plist "$RUNNER_TEMP/icon-info.plist" \
            --output-format human-readable-text --warnings --errors
          test -s macos-icon/Assets.car
          test -s macos-icon/topo.icns
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-icon
          path: macos-icon/*
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [validate, macos-icon]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            gui: false
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            gui: true
          - os: macos-15
            target: aarch64-apple-darwin
            gui: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            gui: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.96.0'
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: runner.os == 'macOS'
        with:
          name: macos-icon
          path: macos-icon
      - name: Build release binaries from the lockfile
        env:
          TARGET: ${{ matrix.target }}
          BUILD_GUI: ${{ matrix.gui }}
        run: |
          if [[ "$TARGET" == x86_64-pc-windows-msvc ]]; then
            export RUSTFLAGS='-C target-feature=+crt-static'
          elif [[ "$TARGET" == *-apple-darwin ]]; then
            export MACOSX_DEPLOYMENT_TARGET=13.0
          fi
          cargo build --locked --release --target "$TARGET" -p topo-cli
          if [[ "$BUILD_GUI" == true ]]; then
            cargo build --locked --release --target "$TARGET" -p topo-gui
          fi
      - name: Smoke test the CLI and package binaries
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
          BUILD_GUI: ${{ matrix.gui }}
          MACOS_ICON_DIR: macos-icon
        run: bash .github/scripts/package-release.sh
      - name: Verify Windows installation, upgrade and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: ./.github/scripts/test-windows-installer.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [validate, checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Check release assets and write SHA256 checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 7
          sha256sum ./*.tar.gz ./*.pkg ./*-setup.exe > SHA256SUMS
          sha256sum --check SHA256SUMS
      # Private repository attestations require GitHub Enterprise Cloud.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: dist/*
      - name: Publish only after every check and platform build passes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite published assets.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == "refs/heads/release/$RELEASE_TAG" ]] && ! gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GH_REPO/git/tags" --method POST \
              -f tag="$RELEASE_TAG" -f message="topo $RELEASE_TAG" \
              -f object="${{ needs.validate.outputs.sha }}" -f type=commit --jq .sha)
            gh api "repos/$GH_REPO/git/refs" --method POST -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_sha"
          fi
          notes="docs/release-notes/$RELEASE_TAG.md"
          notes_args=()
          if [[ -f "$notes" ]]; then
            notes_args=(--notes-file "$notes")
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "topo $RELEASE_TAG" "${notes_args[@]}"
          gh release upload "$RELEASE_TAG" dist/*
          gh release edit "$RELEASE_TAG" --draft=false

  deploy-cloud:
    needs: publish
    uses: ./.github/workflows/deploy-cloud.yml
    with:
      environment: production
    secrets: inherit
