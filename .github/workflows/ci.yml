name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck=""
      - name: Validate packaging scripts
        run: |
          bash -n .github/scripts/package-release.sh
          bash -n assets/branding/install-linux-desktop.sh

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            packages: --workspace --exclude topo-gui
          - os: windows-2025
            packages: --workspace --exclude topo-gui
          - os: macos-15
            packages: --workspace
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.96.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ runner.arch }}-1.96.0-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ci-${{ runner.os }}-${{ runner.arch }}-1.96.0-${{ hashFiles('Cargo.lock') }}-
      - name: Check formatting
        if: runner.os == 'macOS'
        run: cargo fmt --all -- --check
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libclang-dev
      - name: Check native GUI on Linux and Windows
        if: runner.os != 'macOS'
        run: cargo check --locked -p topo-gui
      - name: Lint
        env:
          PACKAGES: ${{ matrix.packages }}
        run: cargo clippy --locked $PACKAGES --all-targets -- -D warnings
      - name: Lint the headless screenshot build of the GUI
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p topo-gui --all-targets --features screenshot -- -D warnings
      - name: Lint the Worker build of the server
        if: runner.os == 'Linux'
        run: cargo clippy --locked -p topo-server --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        env:
          PACKAGES: ${{ matrix.packages }}
        run: cargo test --locked $PACKAGES
